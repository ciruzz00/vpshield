name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go mod tidy && git diff --exit-code go.mod go.sum || echo "::warning::run go mod tidy and commit go.sum"
      - run: sudo apt-get install -y nftables
      - run: go vet ./...
      - run: sudo -E env "PATH=$PATH" go test ./...
      - run: CGO_ENABLED=0 go build ./cmd/vpshield
